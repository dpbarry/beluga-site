<H2><A NAME="SECTION00055000000000000000">
Holes</A>
</H2>
Beluga supports <SPAN  CLASS="textit"><SPAN  CLASS="textbf">holes</SPAN></SPAN> for bound variables as well as contextual objects and variables. A bound variable in an abstraction which does not appear in the body can be replaced with the underscore <TT>_</TT>.
