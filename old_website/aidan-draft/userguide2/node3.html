<H2><A NAME="SECTION00021000000000000000">
Reserved Characters</A>
</H2>
The following characters are reserved and cannot be used anywhere in ordinary identifiers.
<DIV ALIGN="CENTER">
<TABLE CELLPADDING=3 BORDER="1">
<TR><TD ALIGN="LEFT">.</TD>
<TD ALIGN="RIGHT">period</TD>
<TD ALIGN="LEFT">%</TD>
<TD ALIGN="RIGHT">percent sign</TD>
<TD ALIGN="LEFT">( )</TD>
<TD ALIGN="RIGHT">parentheses</TD>
</TR>
<TR><TD ALIGN="LEFT">,</TD>
<TD ALIGN="RIGHT">comma</TD>
<TD ALIGN="LEFT"><SPAN CLASS="MATH"><IMG
 WIDTH="10" HEIGHT="36" ALIGN="MIDDLE" BORDER="0"
 SRC="img1.png"
 ALT="$\vert$"></SPAN></TD>
<TD ALIGN="RIGHT">veritcal bar</TD>
<TD ALIGN="LEFT">[ ]</TD>
<TD ALIGN="RIGHT">brackets</TD>
</TR>
<TR><TD ALIGN="LEFT">:</TD>
<TD ALIGN="RIGHT">colon</TD>
<TD ALIGN="LEFT">"</TD>
<TD ALIGN="RIGHT">quotation mark</TD>
<TD ALIGN="LEFT">{ }</TD>
<TD ALIGN="RIGHT">braces</TD>
</TR>
<TR><TD ALIGN="LEFT">;</TD>
<TD ALIGN="RIGHT">semicolon</TD>
<TD ALIGN="LEFT"><SPAN CLASS="MATH"><IMG
 WIDTH="14" HEIGHT="36" ALIGN="MIDDLE" BORDER="0"
 SRC="img2.png"
 ALT="$\backslash$"></SPAN></TD>
<TD ALIGN="RIGHT">backslash</TD>
<TD ALIGN="LEFT"><SPAN CLASS="MATH"><IMG
 WIDTH="32" HEIGHT="31" ALIGN="MIDDLE" BORDER="0"
 SRC="img3.png"
 ALT="$&lt; &gt;$"></SPAN></TD>
<TD ALIGN="RIGHT">chevrons</TD>
</TR>
</TABLE>
</DIV>
