<H2><A NAME="SECTION00025000000000000000">
Comments</A>
</H2>
Beluga supports single-line and multi-line comments using <TT>%</TT> and <TT>%{</TT> <SPAN CLASS="MATH"><IMG
 WIDTH="25" HEIGHT="18" ALIGN="BOTTOM" BORDER="0"
 SRC="img6.png"
 ALT="$\ldots$"></SPAN> <TT>}%</TT>, respectively. Both can contain any character.
<DIV ALIGN="CENTER">
<TABLE CELLPADDING=3 BORDER="1">
<TR><TD ALIGN="LEFT"><TT>%</TT> <SPAN  CLASS="textit">this is a single-line comment</SPAN></TD>
<TD ALIGN="RIGHT"><TT>%{</TT> <SPAN  CLASS="textit">this is a multi-line comment</SPAN>  <TT>}%</TT></TD>
</TR>
</TABLE>
